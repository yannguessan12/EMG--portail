name: Compiler l'APK
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'supabase/**', '**.md']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Fichier Firebase
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GSJ" > android/app/google-services.json
      - run: npx cap sync android
      - name: Compiler
        working-directory: android
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/emg.keystore"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/emg.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
              -Pandroid.injected.signing.key.password="$KS_PASS"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: emg-portail-apk
          path: android/app/build/outputs/apk/**/*.apk
